package:
  name: gnsstk
  version: {{ environ.get('GIT_LAST_TAG', 'v0.0.0')[1:] }}

source:
  path: ../

build:
  number: {{ environ.get('GIT_CHANGES_LAST_TAG', 0) }}
  script_env:
    - GIT_COMMIT

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ cdt('xorg-x11-proto-devel') }}  # [linux]
    # Issue with conda glibc version <2.28.  See TKS-855
    # Adding sysroot_liunx-64 and libxcrypt-devel-el8-x86_64
    - sysroot_linux-64 >=2.28
    - libxcrypt-devel-el8-x86_64  # [py<39]
  host:
    - python {{python}}
    - setuptools
    - enum34  # [py<=35]
  run:
    - python
    - enum34  # [py<=35]

test:
  imports:
    - gnsstk

about:
  home: https://sgl-git.arlut.utexas.edu:sgl-tks/gnsstk
  summary: The GNSS Toolkit (GNSSTk)
  description: |
    The GNSS Toolkit (GNSSTk) is an open-source (LGPL) project sponsored by
    the Space and Geophysics Laboratory (SGL).
